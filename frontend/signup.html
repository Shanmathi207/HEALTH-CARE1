<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Smart Care Signup - Create your healthcare account">
    <title>Sign Up - Smart Care</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="login-styles.css">
    <style>
        .role-fields {
            display: none;
            flex-direction: column;
            gap: 1.5rem;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <!-- Left Panel -->
        <div class="login-left">
            <div class="brand-content">
                <div class="logo-large">
                    <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="64" height="64" rx="16" fill="url(#login-logo-gradient)" />
                        <path d="M32 16L32 48M16 32L48 32" stroke="white" stroke-width="5" stroke-linecap="round" />
                        <circle cx="32" cy="32" r="6" fill="white" />
                        <defs>
                            <linearGradient id="login-logo-gradient" x1="0" y1="0" x2="64" y2="64">
                                <stop offset="0%" stop-color="#2563eb" />
                                <stop offset="100%" stop-color="#1e40af" />
                            </linearGradient>
                        </defs>
                    </svg>
                    <h1>Smart Care</h1>
                </div>
                <p class="brand-tagline">Join our health network today</p>
                <div class="feature-list">
                    <div class="feature-item">
                        <div class="feature-icon">🛡️</div>
                        <div class="feature-text">
                            <h3>Secure Platform</h3>
                            <p>Your data is encrypted and safe</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="background-pattern"></div>
        </div>

        <!-- Right Panel - Signup Form -->
        <div class="login-right">
            <div class="login-form-container" style="max-height: 90vh; overflow-y: auto; padding-right: 10px;">
                <button class="back-button" onclick="window.location.href='index.html'">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M12 4L6 10l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                    Back to Home
                </button>

                <div class="form-header">
                    <h2>Create Account</h2>
                    <p>Start your professional healthcare journey</p>
                </div>

                <div class="login-tabs">
                    <button class="tab-btn active" data-tab="patient">Patient</button>
                    <button class="tab-btn" data-tab="doctor">Doctor</button>
                    <button class="tab-btn" data-tab="hospital">Admin</button>
                </div>

                <form class="login-form" id="signupForm">
                    <!-- Common Fields -->
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <div class="input-wrapper">
                            <input type="text" id="name" name="name" placeholder="John Doe" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-wrapper">
                            <input type="email" id="email" name="email" placeholder="john@example.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <div class="input-wrapper">
                            <input type="tel" id="phone" name="phone" placeholder="+1 234 567 890" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="password" name="password" placeholder="••••••••" required
                                minlength="6">
                        </div>
                    </div>

                    <!-- Role Based Fields -->
                    <div id="patientFields" class="role-fields" style="display: flex;">
                        <div class="form-group">
                            <label for="age">Age</label>
                            <div class="input-wrapper">
                                <input type="number" id="age" name="age" placeholder="25">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="gender">Gender</label>
                            <div class="input-wrapper">
                                <select id="gender" name="gender" class="form-select"
                                    style="width: 100%; padding: 0.875rem; border: 2px solid var(--neutral-200); border-radius: var(--radius-lg);">
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div id="doctorFields" class="role-fields">
                        <div class="form-group">
                            <label for="specialization">Specialization</label>
                            <div class="input-wrapper">
                                <input type="text" id="specialization" name="specialization" placeholder="Cardiologist">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="department">Department</label>
                            <div class="input-wrapper">
                                <input type="text" id="department" name="department" placeholder="Cardiology">
                            </div>
                        </div>
                    </div>

                    <div id="hospitalFields" class="role-fields">
                        <div class="form-group">
                            <label for="hospitalName">Hospital Name</label>
                            <div class="input-wrapper">
                                <input type="text" id="hospitalName" name="hospitalName"
                                    placeholder="City General Hospital">
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="login-button" id="signupBtn">
                        <span>Create Account</span>
                    </button>
                </form>

                <div class="signup-prompt">
                    Already have an account? <a href="login.html">Login here</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tabs = document.querySelectorAll('.tab-btn');
        const roleFields = {
            patient: document.getElementById('patientFields'),
            doctor: document.getElementById('doctorFields'),
            hospital: document.getElementById('hospitalFields')
        };
        let currentRole = 'patient';

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                currentRole = tab.getAttribute('data-tab');

                // Hide all role fields
                Object.values(roleFields).forEach(f => f.style.display = 'none');
                // Show current role fields
                roleFields[currentRole].style.display = 'flex';
            });
        });

        document.getElementById('signupForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = document.getElementById('signupBtn');
            btn.classList.add('loading');
            btn.disabled = true;

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            data.userType = currentRole;

            setTimeout(() => {
                btn.classList.remove('loading');
                btn.disabled = false;
                alert(`Demo signup complete for ${data.email}.\n\nUse the login page with the same email and password, or click a demo account button there.`);
                window.location.href = 'login.html';
            }, 600);
        });
    </script>
</body>

</html>
